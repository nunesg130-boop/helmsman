name: Container

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Node 24 contracts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      is_beta: ${{ steps.release.outputs.is_beta }}
      repository: ${{ steps.release.outputs.repository }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node 24.19.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Validate package version and release tag
        id: release
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          VERSION="${version}" node <<'NODE'
          const version = process.env.VERSION || "";
          const semverWithoutBuildMetadata = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?$/u;
          if (!semverWithoutBuildMetadata.test(version)) {
            console.error(`package.json version is not valid container SemVer: ${version}`);
            process.exit(1);
          }
          NODE

          if [[ "${RELEASE_REF}" == refs/tags/* ]]; then
            expected="v${version}"
            if [[ "${RELEASE_TAG}" != "${expected}" ]]; then
              echo "Release tag ${RELEASE_TAG} does not match package.json (${expected})." >&2
              exit 1
            fi
          fi

          is_prerelease=false
          is_beta=false
          repository="${GITHUB_REPOSITORY,,}"
          if [[ "${version}" == *-* ]]; then
            is_prerelease=true
          fi
          if [[ "${version}" == *-beta.* ]]; then
            is_beta=true
          fi

          {
            echo "version=${version}"
            echo "is_prerelease=${is_prerelease}"
            echo "is_beta=${is_beta}"
            echo "repository=${repository}"
          } >> "${GITHUB_OUTPUT}"

      - name: Run contracts
        run: npm test

  smoke:
    name: Linux ${{ matrix.arch }} runtime smoke
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and exercise the hardened container
        shell: bash
        run: |
          set -euo pipefail
          image="helmsman-smoke:${{ matrix.arch }}"
          volume="helmsman-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.arch }}"
          container=""
          cleanup() {
            if [[ -n "${container}" ]]; then docker rm --force "${container}" >/dev/null 2>&1 || true; fi
            docker volume rm "${volume}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker buildx build \
            --platform "linux/${{ matrix.arch }}" \
            --build-arg HELMSMAN_VERSION="${{ needs.test.outputs.version }}" \
            --load \
            --tag "${image}" .
          docker volume create "${volume}" >/dev/null
          container="$(docker run --detach \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777 \
            --volume "${volume}:/data" \
            "${image}")"

          healthy=false
          for _ in {1..20}; do
            if docker exec "${container}" node server/index.mjs healthcheck; then
              healthy=true
              break
            fi
            sleep 1
          done
          if [[ "${healthy}" != true ]]; then
            docker logs "${container}"
            exit 1
          fi

          docker exec "${container}" node -e 'if (process.getuid() !== 10001 || process.getgid() !== 10001) process.exit(1)'
          if docker exec "${container}" node -e 'require("node:fs").writeFileSync("/app/write-probe", "no")'; then
            echo "The read-only application filesystem accepted a write." >&2
            exit 1
          fi
          docker exec "${container}" node -e 'const fs=require("node:fs"); fs.writeFileSync("/data/write-probe", "ok", {mode:0o600}); fs.unlinkSync("/data/write-probe")'
          docker exec "${container}" node -e 'const fs=require("node:fs"); if ((fs.statSync("/data/state.json").mode & 0o777) !== 0o600) process.exit(1)'

  image:
    name: Publish Linux AMD64 and ARM64 image
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - smoke
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate OCI metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.REGISTRY }}/${{ needs.test.outputs.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=beta,enable=${{ needs.test.outputs.is_beta == 'true' }}
            type=raw,value=latest,enable=${{ needs.test.outputs.is_prerelease == 'false' }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Helmsman
            org.opencontainers.image.description=Local-first media and infrastructure operations center with a hardened self-hosted control plane
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/README.md
          annotations: |
            org.opencontainers.image.title=Helmsman
            org.opencontainers.image.description=Local-first media and infrastructure operations center with a hardened self-hosted control plane
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/README.md

      - name: Build and publish the manifest
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            HELMSMAN_VERSION=${{ needs.test.outputs.version }}
            HELMSMAN_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  release:
    name: Publish GitHub release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Render and publish deployable assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.test.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.test.outputs.is_prerelease }}
          RELEASE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          umask 077

          release_dir="$(mktemp -d "${RUNNER_TEMP}/helmsman-release.XXXXXX")"
          repository="${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_REF_NAME}"
          tagged_ref="ghcr.io/OWNER/REPOSITORY:${RELEASE_VERSION}"

          if [[ ! "${RELEASE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The published multi-architecture image did not return a valid manifest digest." >&2
            exit 1
          fi
          image_ref="ghcr.io/${repository}@${RELEASE_DIGEST}"

          fetch_tag_file() {
            local source_path="$1"
            local destination="$2"
            gh api \
              --method GET \
              --header "Accept: application/vnd.github.raw+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/contents/${source_path}?ref=${GITHUB_SHA}" \
              > "${destination}"
          }

          fetch_tag_file compose.yaml "${release_dir}/compose.yaml"
          fetch_tag_file container.env.example "${release_dir}/container.env.example"

          for asset in compose.yaml container.env.example; do
            if ! grep -Fq "${tagged_ref}" "${release_dir}/${asset}"; then
              echo "The ${asset} source template does not reference ${tagged_ref}." >&2
              exit 1
            fi
            sed -i "s#${tagged_ref}#${image_ref}#g" "${release_dir}/${asset}"
            if grep -Fq 'OWNER/REPOSITORY' "${release_dir}/${asset}"; then
              echo "The ${asset} release asset still contains the repository placeholder." >&2
              exit 1
            fi
            if ! grep -Fq "${image_ref}" "${release_dir}/${asset}"; then
              echo "The ${asset} release asset does not pin the published manifest digest." >&2
              exit 1
            fi
          done

          (
            cd "${release_dir}"
            sha256sum compose.yaml container.env.example > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            existing_dir="$(mktemp -d "${RUNNER_TEMP}/helmsman-existing-release.XXXXXX")"
            existing_draft="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')"
            existing_prerelease="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json isPrerelease --jq '.isPrerelease')"

            if [[ "${existing_prerelease}" != "${RELEASE_PRERELEASE}" ]]; then
              echo "The existing ${tag} release has the wrong prerelease state." >&2
              exit 1
            fi

            gh release download \
              "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --dir "${existing_dir}" \
              --pattern compose.yaml \
              --pattern container.env.example \
              --pattern SHA256SUMS

            for asset in compose.yaml container.env.example SHA256SUMS; do
              if [[ ! -f "${existing_dir}/${asset}" ]] \
                || ! cmp --silent "${release_dir}/${asset}" "${existing_dir}/${asset}"; then
                echo "The existing ${tag} ${asset} differs from the tagged image; publish a new version instead of replacing release assets." >&2
                exit 1
              fi
            done

            if [[ "${existing_draft}" == "true" ]]; then
              gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --draft=false
            fi
            echo "The existing ${tag} release assets match the published manifest digest."
            exit 0
          fi

          create_args=(
            "${tag}"
            "${release_dir}/compose.yaml"
            "${release_dir}/container.env.example"
            "${release_dir}/SHA256SUMS"
            --repo "${GITHUB_REPOSITORY}"
            --verify-tag
            --title "Helmsman ${RELEASE_VERSION}"
            --generate-notes
          )
          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
            create_args+=(--prerelease)
          fi
          gh release create "${create_args[@]}"
